                properties:
                  conformsTo:
                    type: array
                    items:
                      type: string
                      format: uri
  /ogc/collections:
    get:
      tags: [OGC]
      summary: List OGC API - Features collections
      operationId: ogcCollections
      responses:
        "200":
          description: Available public bathymetric collections.
          content:
            application/json:
              schema:
                type: object
  /ogc/collections/{collectionId}/items:
    get:
      tags: [OGC]
      summary: Query OGC API - Features items
      operationId: ogcCollectionItems
      security:
        - {}
        - UserApiKey: []
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            enum: [public-tracks, public-soundings, public-waypoints]
        - name: bbox
          in: query
          schema:
            type: string
        - name: datetime
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: vertical_datum
          in: query
          schema:
            $ref: "#/components/schemas/VerticalDatum"
        - name: qartod_qc_flag
          in: query
          schema:
            type: integer
            enum: [1, 2, 3, 4]
        - name: iho_s44_order
          in: query
          schema:
            $ref: "#/components/schemas/IhoS44Order"
        - name: calibration_tier
          in: query
          schema:
            type: string
            enum: [UNREDUCED, TIDE_REDUCED, SV_TIDE_CALIBRATED, MOTION_COMPENSATED]
        - name: provenance
          in: query
          schema:
            type: string
            enum: [user-track, noaa-dcdb, usgs-3dep, gebco]
        - name: crs
          in: query
          description: OGC API - Features Part 2 output CRS URI (defaults to OGC:CRS84).
          schema:
            type: string
        - name: bbox-crs
          in: query
          description: OGC API - Features Part 2 bbox CRS URI (defaults to OGC:CRS84).
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OGC API - Features GeoJSON FeatureCollection.
          content:
            application/geo+json:
              schema:
                type: object
  /api/v1/stats/public:
    get:
      tags: [System]
      summary: Honest Day-1 public coverage counters for landing page and status display
      operationId: getPublicStats
      responses:
        "200":
          description: Current public platform coverage statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStatsResponse"
  /api/v1/system/status:
    get:
      tags: [System]
      summary: Public runtime feature-flag and maintenance banner status for SPA controls
      operationId: getPublicSystemStatus
      responses:
        "200":
          description: Active public capability flags and optional maintenance banner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSystemStatusResponse"
  /health/live:
    get:
      tags: [System]
      summary: Process liveness probe
      operationId: getHealthLive
      responses:
        "200":
          description: Process alive.
  /health/ready:
    get:
      tags: [System]
      summary: Dependency readiness probe (spatial database and object storage connectivity)
      operationId: getHealthReady
      responses:
        "200":
          description: Service ready to handle traffic.
        "503":
          description: Dependency unavailable.
  /tiles/manifest.json:
    get:
      tags: [Tiles]
      summary: Public regional PMTiles shard manifest for viewport vector tile mounting (served on tiles.opendepthmap.org)
      operationId: getPublicTilesManifest
      responses:
        "200":
          description: Active regional PMTiles shards, OSM attribution, and mandatory disclaimer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TileManifestResponse"
  /tiles/private/{z}/{x}/{y}.mvt:
    get:
      tags: [Tiles]
      summary: Serve dynamic MVT vector tiles for authenticated private vault tracks
      operationId: getPrivateMvtTile
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:private_vault"]
        - UserApiKey: []
      parameters:
        - name: z
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 20
        - name: x
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Mapbox Vector Tile binary payload.
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                format: binary
        "204":
          description: Empty tile.
        "401":
          $ref: "#/components/responses/ProblemDetails"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-odm-session
      description: "First-party SameSite=Lax HttpOnly Secure browser session cookie issued on https://opendepthmap.org. State-changing cookie requests MUST include the X-Requested-With: OpenDepthMap CSRF header."
    OAuth2Bearer:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://opendepthmap.org/oauth2/authorize
          tokenUrl: https://opendepthmap.org/oauth2/token
          scopes:
            read:public: Read public bathymetry datasets and OGC features
            read:prefs: Read contributor preferences and device registrations
            write:tracks: Register devices, upload raw logs, and manage own tracks
            write:waypoints: Create and enrich dive waypoints and routes
            read:private_vault: Read unpublished private tracks, GeoParquet, and private MVT tiles
    UserApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Personal User API Key (odm_usr_ prefix) with configurable scopes.
    DeviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Vessel/Device API Key (odm_dev_ prefix) restricted strictly to write:tracks scope.
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemDetails:
      description: RFC 9457 Problem Details error response.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type:
                type: string
                format: uri
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              error_code:
                type: string
              trace_id:
                type: string
  schemas:
    VerticalDatum:
      type: string
      enum: [UNREDUCED, MLLW, IGLD, LOCAL_LAKE, MANUAL_DATUM]
    IhoS44Order:
      type: string
      enum: [SPECIAL_ORDER, ORDER_1A, ORDER_1B, ORDER_2, UNASSESSED_CSB]
    SourceFormat:
      type: string
      description: Day-1 GA formats are GPX, GEOJSON, CSV, and NMEA_0183. Additional open formats (NMEA_2000, SUBSURFACE_SSRF, SIGNALK_DELTA) and proprietary binary formats (LOWRANCE_SL2, LOWRANCE_SL3, HUMMINBIRD_ZIP, GARMIN_RSD) roll out in Phase 1.5.
      enum:
        - GPX
        - GEOJSON
        - CSV
        - NMEA_0183
        - NMEA_2000
        - SUBSURFACE_SSRF
        - SIGNALK_DELTA
        - LOWRANCE_SL2
        - LOWRANCE_SL3
        - HUMMINBIRD_ZIP
        - GARMIN_RSD
    WaterBodyType:
      type: string
      enum: [COASTAL_TIDAL, GREAT_LAKES, INLAND_FRESHWATER]
    DeviceCategory:
      type: string
      enum:
        - SURFACE_BUOY
        - RECREATIONAL_VESSEL
        - DIVER_COMPUTER
        - USV_AUTONOMOUS
        - THIRD_PARTY_PLOTTER
    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
          example: ODM-7K9P
        verification_uri:
          type: string
          format: uri
          example: https://opendepthmap.org/device
        verification_uri_complete:
          type: string
          format: uri
        expires_in:
          type: integer
          example: 600
        interval:
          type: integer
          example: 5
    DeviceTokenResponse:
      type: object
      required: [access_token, token_type, scope, device_id]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        scope:
          type: string
          const: "write:tracks"
        device_id:
          type: string
          format: uuid
        device_api_key:
          type: string
          description: One-time plaintext Device API Key (odm_dev_ prefix) if provisioned during pairing.
    UserApiKeySummary:
      type: object
      required: [id, name, key_prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          example: odm_usr_9a3f
        scopes:
          type: array
          items:
            type: string
            enum: ["read:public", "read:prefs", "write:tracks", "write:waypoints", "read:private_vault"]
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateUserApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: ["read:public", "read:prefs", "write:tracks", "write:waypoints", "read:private_vault"]
        expires_at:
          type: [string, "null"]
          format: date-time
    CreateUserApiKeyResponse:
      allOf:
        - $ref: "#/components/schemas/UserApiKeySummary"
        - type: object
          required: [plaintext_key]
          properties:
            plaintext_key:
              type: string
              description: Returned once at creation time. Store securely.
    DeviceProfile:
      type: object
      required:
        - id
        - name
        - device_category
        - key_prefix
        - depth_reference
        - draft_offset_m
        - antenna_offset_x_m
        - antenna_offset_y_m
        - antenna_offset_z_m
        - assumed_sound_speed_ms
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        device_category:
          $ref: "#/components/schemas/DeviceCategory"
        key_prefix:
          type: string
          example: odm_dev_4c21
        depth_reference:
          type: string
          enum: [BELOW_TRANSDUCER, BELOW_WATERLINE]
        draft_offset_m:
          type: number
        antenna_offset_x_m:
          type: number
        antenna_offset_y_m:
          type: number
        antenna_offset_z_m:
          type: number
        transducer_freq_khz:
          type: [integer, "null"]
        beamwidth_deg:
          type: [number, "null"]
        assumed_sound_speed_ms:
          type: number
        active_calibration_effective_from:
          type: string
          format: date-time
        is_active:
          type: boolean
        last_seen_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateDeviceRequest:
      type: object
      required: [name, device_category]
      properties:
        name:
          type: string
          maxLength: 100
        device_category:
          $ref: "#/components/schemas/DeviceCategory"
        effective_from:
          type: [string, "null"]
          format: date-time
          description: Optional start timestamp for initial calibration revision (defaults to 1970-01-01T00:00:00Z).
        depth_reference:
          type: string
          enum: [BELOW_TRANSDUCER, BELOW_WATERLINE]
          default: BELOW_TRANSDUCER
        draft_offset_m:
          type: number
          default: 0.0
        antenna_offset_x_m:
          type: number
          default: 0.0
        antenna_offset_y_m:
          type: number
          default: 0.0
        antenna_offset_z_m:
          type: number
          default: 0.0
        transducer_freq_khz:
          type: [integer, "null"]
          minimum: 10
          maximum: 2000
        beamwidth_deg:
          type: [number, "null"]
          minimum: 0.5
          maximum: 180.0
        assumed_sound_speed_ms:
          type: number
          default: 1500.0
          minimum: 1400.0
          maximum: 1600.0
    UpdateDeviceRequest:
      type: object
      description: Updates device identity metadata only. Sensor rig offsets MUST be updated via effective-dated calibration revisions (/calibrations).
      properties:
        name:
          type: string
          maxLength: 100
        device_category:
          $ref: "#/components/schemas/DeviceCategory"
    UpdateDeviceCalibrationRequest:
      type: object
      properties:
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: [string, "null"]
          format: date-time
        depth_reference:
          type: string
          enum: [BELOW_TRANSDUCER, BELOW_WATERLINE]
        draft_offset_m:
          type: number
        antenna_offset_x_m:
          type: number
        antenna_offset_y_m:
          type: number
        antenna_offset_z_m:
          type: number
        transducer_freq_khz:
          type: [integer, "null"]
        beamwidth_deg:
          type: [number, "null"]
        assumed_sound_speed_ms:
          type: number
        notes:
          type: [string, "null"]
    CreateDeviceResponse:
      allOf:
        - $ref: "#/components/schemas/DeviceProfile"
        - type: object
          required: [plaintext_device_api_key]
          properties:
            plaintext_device_api_key:
              type: string
              description: Returned once at registration. Scoped strictly to write:tracks for this device.
    UploadUrlRequest:
      type: object
      required: [device_id, filename, byte_size, source_format]
      properties:
        device_id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        byte_size:
          type: integer
          minimum: 1
          maximum: 262144000
        source_format:
          $ref: "#/components/schemas/SourceFormat"
        title:
          type: string
          maxLength: 150
        water_body_type:
          $ref: "#/components/schemas/WaterBodyType"
          default: COASTAL_TIDAL
        depth_unit:
          type: string
          enum: [METERS, FEET, FATHOMS]
          default: METERS
          description: Unit of depth values in CSV uploads (converted immediately to positive-downward meters).
        tide_station_id_override:
          type: [string, "null"]
          description: Optional NOAA CO-OPS station ID override (prevents wrong-basin matches across peninsulas).
        manual_water_level_offset_m:
          type: [number, "null"]
    UploadUrlResponse:
      type: object
      required: [job_id, upload_url, required_headers, expires_at]
      properties:
        job_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        required_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    JobStatusResponse:
      type: object
      required: [job_id, job_type, status, progress_pct, created_at]
      properties:
        job_id:
          type: string
          format: uuid
        job_type:
          type: string
          enum: [INGESTION, RECALIBRATE, EXPORT, OFFLINE_PACK, PUBLISH, MEDIA_PROCESSING]
        summary_label:
          type: [string, "null"]
          description: Human-readable label for UI history lists (e.g. export format/area or track filename).
        metadata:
          type: [object, "null"]
          additionalProperties: true
        status_token:
          type: [string, "null"]
          description: Short-lived HMAC token returned only on anonymous public POST /api/v1/exports for polling GET /api/v1/exports/{jobId}.
        status:
          type: string
          enum:
            - PENDING_UPLOAD
            - EXPIRED
            - QUEUED
            - PARSING
            - QC_RUNNING
            - TIDE_REDUCING
            - PROCESSING
            - COMPLETED
            - FAILED
        progress_pct:
          type: integer
          minimum: 0
          maximum: 100
        track_id:
          type: [string, "null"]
          format: uuid
        download_url:
          type: [string, "null"]
          format: uri
        manifest_url:
          type: [string, "null"]
          format: uri
        byte_size:
          type: [integer, "null"]
        expires_at:
          type: [string, "null"]
          format: date-time
        error_code:
          type: [string, "null"]
        error_detail:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    SurveyTrackSummary:
      type: object
      required:
        - id
        - device_id
        - title
        - started_at
        - ended_at
        - sounding_count
        - vertical_datum
        - tide_source
        - iho_s44_order
        - is_public
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: True vessel/device UUID for the owner; per-track salted pseudonym UUID for non-owner/public callers.
        title:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        sounding_count:
          type: integer
        good_sounding_count:
          type: integer
        suspect_sounding_count:
          type: integer
        bad_sounding_count:
          type: integer
        min_depth_m:
          type: [number, "null"]
        max_depth_m:
          type: [number, "null"]
        vertical_datum:
          $ref: "#/components/schemas/VerticalDatum"
        tide_source:
          type: string
          enum: [PENDING, NOAA_COOPS_OBSERVED, NOAA_COOPS_PREDICTED, FRESHWATER_ZERO, MANUAL_OFFSET, UNAVAILABLE]
        tide_station_id:
          type: [string, "null"]
        iho_s44_order:
          $ref: "#/components/schemas/IhoS44Order"
        is_public:
          type: boolean
        track_modality:
          type: string
          enum: [BATHYMETRIC_SONAR, DIVE_PROFILE]
          description: DIVE_PROFILE tracks (.ssrf) are excluded from seafloor bathymetry, contours, and IHO B-12 CSB.
        calibration_tier:
          type: string
          enum: [UNREDUCED, TIDE_REDUCED, SV_TIDE_CALIBRATED, MOTION_COMPENSATED]
        calibration_revision_id:
          type: string
          format: uuid
        calibration_stale:
          type: boolean
          description: Owner-only flag; true when the device calibration revision for this track's time window was edited after last calibration.
        water_body_type:
          $ref: "#/components/schemas/WaterBodyType"
        tide_station_id_override:
          type: [string, "null"]
          description: Owner-only pinned NOAA CO-OPS station ID override.
        manual_water_level_offset_m:
          type: [number, "null"]
        water_temp_default_c:
          type: [number, "null"]
        salinity_default_psu:
          type: [number, "null"]
        bbox:
          type: [array, "null"]
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: Private bbox for owner; post-redaction public_bbox (or null if fully trimmed/binned) for non-owner callers.
    DeviceCalibrationRevision:
      type: object
      required:
        - id
        - device_id
        - effective_from
        - draft_offset_m
        - antenna_offset_x_m
        - antenna_offset_y_m
        - antenna_offset_z_m
        - assumed_sound_speed_ms
        - created_at
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: [string, "null"]
          format: date-time
        depth_reference:
          type: string
          enum: [BELOW_TRANSDUCER, BELOW_WATERLINE]
          default: BELOW_TRANSDUCER
          description: Prevents double-counting static draft offset when chartplotters already log depth below waterline.
        draft_offset_m:
          type: number
        antenna_offset_x_m:
          type: number
        antenna_offset_y_m:
          type: number
        antenna_offset_z_m:
          type: number
        transducer_freq_khz:
          type: [integer, "null"]
        beamwidth_deg:
          type: [number, "null"]
        assumed_sound_speed_ms:
          type: number
        notes:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CreateDeviceCalibrationRequest:
      type: object
      required: [effective_from]
      properties:
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: [string, "null"]
          format: date-time
        depth_reference:
          type: string
          enum: [BELOW_TRANSDUCER, BELOW_WATERLINE]
          default: BELOW_TRANSDUCER
          description: Prevents double-counting static draft offset when chartplotters already log depth below waterline.
        draft_offset_m:
          type: number
          default: 0.0
        antenna_offset_x_m:
          type: number
          default: 0.0
        antenna_offset_y_m:
          type: number
          default: 0.0
        antenna_offset_z_m:
          type: number
          default: 0.0
        transducer_freq_khz:
          type: [integer, "null"]
        beamwidth_deg:
          type: [number, "null"]
        assumed_sound_speed_ms:
          type: number
          default: 1500.0
        notes:
          type: [string, "null"]
    PublishTrackRequest:
      type: object
      properties:
        trim_start_m:
          type: number
          minimum: 0.0
          maximum: 5000.0
          default: 0.0
          description: User-chosen distance (meters along track from start) to erase from public sharing.
        trim_end_m:
          type: number
          minimum: 0.0
          maximum: 5000.0
          default: 0.0
          description: User-chosen distance (meters along track from end) to erase from public sharing.
        fuzz_endpoints:
          type: boolean
          default: false
          description: Opt-in H3 Resolution 8 blurring near track start, track end, and launch ramps instead of (or in addition to) trimming.
        fuzz_radius_m:
          type: number
          minimum: 25.0
          maximum: 500.0
          default: 150.0
          description: Base radius in meters used when fuzz_endpoints is true.
        grid_binning:
          type: boolean
          default: false
        grid_binning_resolution:
          type: [integer, "null"]
          enum: [9, 10, null]
    PublishTrackResponse:
      type: object
      required: [track_id, job_id, status]
      properties:
        track_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
    RedactionZone:
      type: object
      required: [id, label, geometry, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        geometry:
          type: object
          description: GeoJSON Polygon in OGC:CRS84.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateRedactionZoneRequest:
      type: object
      required: [label, geometry]
      properties:
        label:
          type: string
          maxLength: 100
        geometry:
          type: object
          description: GeoJSON Polygon in OGC:CRS84.
    CreateSiteTakedownRequest:
      type: object
      required: [organization_name, reason_category, geometry]
      properties:
        organization_name:
          type: string
          maxLength: 150
        reason_category:
          type: string
          enum: [CULTURAL_HERITAGE, HISTORIC_WRECK, TRIBAL_SITE, ECOLOGICAL_SENSITIVITY]
        geometry:
          type: object
          description: GeoJSON Polygon in OGC:CRS84.
        notes:
          type: string
    SiteTakedownResponse:
      type: object
      required: [id, organization_name, reason_category, geometry, area_sq_km, status, created_at]
