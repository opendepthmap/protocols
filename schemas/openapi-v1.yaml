              leg_index:
                type: integer
              distance_m:
                type: number
              true_bearing_deg:
                type: number
              magnetic_bearing_deg:
                type: number
              declination_deg:
                type: number
              estimated_seconds:
                type: integer
        created_at:
          type: string
          format: date-time
    CreatePlannedRouteRequest:
      type: object
      required: [name, geometry]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: [string, "null"]
        geometry:
          type: object
        target_depth_m:
          type: [number, "null"]
        planned_swim_speed_ms:
          type: number
          default: 0.5
    CreateOfflinePackRequest:
      type: object
      required: [bbox]
      properties:
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        route_id:
          type: [string, "null"]
          format: uuid
        include_noaa:
          type: boolean
          default: true
        include_osm_basemap:
          type: boolean
          default: true
    CreateExportRequest:
      type: object
      required: [format, scope]
      properties:
        format:
          type: string
          enum: [GEOPARQUET, IHO_B12_CSV, IHO_B12_GEOJSON, CF_NETCDF, COG]
        scope:
          type: string
          enum: [TRACK, BBOX, RELEASE]
        track_id:
          type: [string, "null"]
          format: uuid
        release_id:
          type: [string, "null"]
          format: uuid
        bbox:
          type: [array, "null"]
          minItems: 4
          maxItems: 4
          items:
            type: number
        grid_resolution_m:
          type: [number, "null"]
          minimum: 0.5
          maximum: 500.0
    DatasetRelease:
      type: object
      required: [id, title, license, algorithm_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        doi_identifier:
          type: [string, "null"]
        license:
          type: string
          example: CC0-1.0
        gridding_method:
          type: [string, "null"]
        grid_resolution_m:
          type: [number, "null"]
        algorithm_version:
          type: string
        citation_text:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    ContributorProfile:
      type: object
      required: [display_name, public_track_count, public_waypoint_count, created_at]
      properties:
        display_name:
          type: string
        bio:
          type: [string, "null"]
        osm_linked:
          type: boolean
        public_track_count:
          type: integer
        public_waypoint_count:
          type: integer
        created_at:
          type: string
          format: date-time
