---
openapi: 3.1.0
info:
  title: OpenDepthMap External API
  version: 1.0.0
  summary: Vendor-neutral bathymetric ingestion, privacy vault, OGC API - Features,
    and open export API.
  description: Canonical Phase 1 (Day-1 GA) public REST and OGC API - Features contract
    for https://opendepthmap.org. Supplemental bathymetric reference only; not certified
    for primary marine navigation. See docs/phase-1.5-roadmap.md and schemas/openapi-v1.5-draft.yaml
    for deferred Phase 1.5 extensions.
  license:
    name: CC0-1.0
    identifier: CC0-1.0
servers:
- url: https://opendepthmap.org
  description: Production API (same-origin with web portal)
- url: http://localhost:5080
  description: Local developer sandbox
security: []
tags:
- name: Auth
  description: Google/GitHub browser sessions and Personal User API Key management.
- name: Devices
  description: Mandatory pre-upload vessel and sensor rig registration.
- name: Ingestion
  description: Two-step direct-to-storage upload contract and async job status.
- name: Tracks
  description: Survey track inspection, publishing, and atomic hard-deletion cascades.
- name: Privacy
  description: Personal spatial redaction zones.
- name: Waypoints
  description: Subsea and coastal waypoints.
- name: Routing
  description: Planned water routes, survey transects, and offline PMTiles chart packs.
- name: Exports
  description: GeoParquet 1.1 and IHO B-12 CSB open exports.
- name: OGC
  description: OGC API - Features Part 1 and Part 2 endpoints.
- name: Tiles
  description: Authenticated private dynamic MVT vector tiles.
- name: Catalog
  description: Unified map search and cached public marine observation stations.
- name: System
  description: Public coverage counters, system feature flags, and liveness/readiness
    probes.
paths:
  "/api/v1/auth/logout":
    post:
      tags:
      - Auth
      summary: Terminate the active browser session
      operationId: logoutAccount
      security:
      - SessionCookie: []
      responses:
        '204':
          description: Session terminated.
  "/api/v1/auth/me":
    get:
      tags:
      - Auth
      summary: Get current authenticated user profile, roles, and Contributor Terms
        status
      operationId: getCurrentUser
      security:
      - SessionCookie: []
      - UserApiKey: []
      responses:
        '200':
          description: Current authenticated user context.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticatedUser"
        '401':
          "$ref": "#/components/responses/ProblemDetails"
    patch:
      tags:
      - Auth
      summary: Update contributor display_name or bio
      operationId: updateCurrentUser
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 3
                  maxLength: 80
                bio:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticatedUser"
  "/api/v1/auth/accept-terms":
    post:
      tags:
      - Auth
      summary: Record explicit acceptance of CC0-1.0 Contributor Terms prior to public
        publishing
      operationId: acceptContributorTerms
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - terms_version
              - accepted
              properties:
                terms_version:
                  type: string
                  example: 1.0.0
                accepted:
                  type: boolean
                  const: true
      responses:
        '200':
          description: Contributor Terms acceptance timestamp recorded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthenticatedUser"
  "/api/v1/auth/external/{provider}/start":
    get:
      tags:
      - Auth
      summary: Initiate OAuth2/OIDC redirect for Google or GitHub sign-in or account
        linking
      operationId: startExternalOAuth
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      - name: return_url
        in: query
        description: Relative local path only (starts with /, never //, /\\, or external
          host; prevents CWE-601 open redirect).
        schema:
          type: string
      - name: intent
        in: query
        description: Use 'link' when attaching a second OAuth provider to an active
          session; server cryptographically binds OAuth state to the active session
          ID and verifies matching session on callback.
        schema:
          type: string
          enum:
          - login
          - link
          default: login
      - name: reauth
        in: query
        description: When true, sends prompt=login / max_age=0 to refresh auth_time
          (required within 10 minutes before DELETE /api/v1/auth/account).
        schema:
          type: boolean
          default: false
      responses:
        '302':
          description: Redirects browser to external OAuth provider authorization
            endpoint.
  "/api/v1/auth/external/{provider}/callback":
    get:
      tags:
      - Auth
      summary: Complete OAuth2/OIDC authorization code callback for Google or GitHub
      description: Validates state/PKCE correlation cookies, requires verified provider
        email before account linking, sets __Host-odm-session, and redirects to validated
        local return_url.
      operationId: completeExternalOAuth
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirects to validated local return_url with authenticated
            session cookie.
        '400':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/auth/external/{provider}":
    delete:
      tags:
      - Auth
      summary: Unlink an external OAuth provider from the user account
      operationId: unlinkExternalProvider
      security:
      - SessionCookie: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
      responses:
        '204':
          description: External provider unlinked.
        '409':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/auth/account":
    delete:
      tags:
      - Auth
      summary: Execute atomic hard-deletion cascade for the entire user account
      description: Requires interactive browser session with recent re-authentication
        (auth_time <= 10 minutes via /api/v1/auth/external/{provider}/start?reauth=true;
        never callable via API keys). Returns 409 Conflict if an ingestion, recalibration,
        or publish job is actively PROCESSING for any owned track.
      operationId: deleteAccount
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Account, devices, tracks, waypoints, and storage purged; returns
            synchronous deletion summary.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeletionSummary"
        '409':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/api-keys":
    get:
      tags:
      - Auth
      summary: List Personal User API Keys
      operationId: listUserApiKeys
      security:
      - SessionCookie: []
      responses:
        '200':
          description: List of Personal User API Key metadata (never returns raw key
            secrets).
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/UserApiKeySummary"
    post:
      tags:
      - Auth
      summary: Create a scoped Personal User API Key (odm_usr_ prefix)
      operationId: createUserApiKey
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateUserApiKeyRequest"
      responses:
        '201':
          description: Created Personal User API Key (raw secret shown once).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateUserApiKeyResponse"
        '400':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/api-keys/{keyId}":
    delete:
      tags:
      - Auth
      summary: Revoke a Personal User API Key immediately
      operationId: revokeUserApiKey
      security:
      - SessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/KeyId"
      responses:
        '204':
          description: API key revoked.
        '404':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/devices":
    get:
      tags:
      - Devices
      summary: List registered vessels and field devices
      operationId: listDevices
      security:
      - SessionCookie: []
      - UserApiKey: []
      responses:
        '200':
          description: Registered devices owned by the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeviceProfile"
    post:
      tags:
      - Devices
      summary: Register a vessel or hardware device with sensor rig offsets
      operationId: registerDevice
      security:
      - SessionCookie: []
      - UserApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDeviceRequest"
      responses:
        '201':
          description: Device registered; returns device profile and one-time Device
            API Key (odm_dev_).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDeviceResponse"
        '400':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/devices/{deviceId}":
    patch:
      tags:
      - Devices
      summary: Update device identity metadata (name, category)
      operationId: updateDevice
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateDeviceRequest"
      responses:
        '200':
          description: Updated device profile.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeviceProfile"
    delete:
      tags:
      - Devices
      summary: Soft-deactivate a device and immediately revoke its Device API Key
      description: 'Revokes the device credential and prevents future uploads while
        preserving historical survey track provenance and calibration snapshots.

'
      operationId: deactivateDevice
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/DeviceId"
      responses:
        '204':
          description: Device deactivated and key revoked.
  "/api/v1/devices/{deviceId}/rotate-key":
    post:
      tags:
      - Devices
      summary: Rotate a Device API Key (odm_dev_) without altering calibration history
      operationId: rotateDeviceApiKey
      security:
      - SessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/DeviceId"
      responses:
        '200':
          description: Previous device key immediately revoked; returns new one-time
            plaintext Device API Key.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDeviceResponse"
  "/api/v1/devices/{deviceId}/calibrations":
    get:
      tags:
      - Devices
      summary: List effective-dated sensor rig calibration revisions for a device
      operationId: listDeviceCalibrations
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/DeviceId"
      responses:
        '200':
          description: Chronological non-overlapping calibration revisions.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/DeviceCalibrationRevision"
    post:
      tags:
      - Devices
      summary: Add a new effective-dated sensor rig calibration revision
      description: 'Records a time-bounded sensor rig offset revision without mutating
        existing tracks. Automatically closes an open-ended prior revision when effective_from
        is later; returns 409 Conflict if the range overlaps an existing closed revision.

'
      operationId: createDeviceCalibration
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDeviceCalibrationRequest"
      responses:
        '201':
          description: Calibration revision recorded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeviceCalibrationRevision"
        '409':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/devices/{deviceId}/calibrations/{revisionId}":
    patch:
      tags:
      - Devices
      summary: Correct an existing effective-dated sensor rig calibration revision
      description: 'Updates a historical or active calibration revision without silently
        mutating existing tracks. Tracks captured within the revision window are marked
        calibration_stale=true so owners can explicitly trigger POST /api/v1/tracks/{trackId}/recalibrate.

'
      operationId: updateDeviceCalibration
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/DeviceId"
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateDeviceCalibrationRequest"
      responses:
        '200':
          description: Calibration revision updated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeviceCalibrationRevision"
        '409':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/tracks/upload-url":
    post:
      tags:
      - Ingestion
      summary: Request a 15-minute single-use signed direct PUT URL for raw sonar/track
        upload
      description: 'When authenticated with a DeviceApiKey (odm_dev_), request.device_id
        MUST match the device bound to that key; mismatches return 403 Forbidden.

'
      operationId: requestTrackUploadUrl
      security:
      - SessionCookie: []
      - UserApiKey: []
      - DeviceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UploadUrlRequest"
      responses:
        '201':
          description: Ingestion job created in PENDING_UPLOAD state with scoped single-use
            signed PUT URL.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UploadUrlResponse"
        '400':
          "$ref": "#/components/responses/ProblemDetails"
        '403':
          "$ref": "#/components/responses/ProblemDetails"
        '413':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/jobs":
    get:
      tags:
      - Ingestion
      summary: List recent asynchronous jobs (ingestion, recalibration, publish, export,
        offline pack) owned by the user
      operationId: listUserJobs
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - name: job_type
        in: query
        schema:
          type: string
          enum:
          - INGESTION
          - RECALIBRATE
          - EXPORT
          - OFFLINE_PACK
          - PUBLISH
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of user jobs.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/JobStatusResponse"
                  next_cursor:
                    type:
                    - string
                    - 'null'
  "/api/v1/jobs/{jobId}":
    get:
      tags:
      - Ingestion
      summary: Get asynchronous ingestion, recalibration, publish, export, or offline
        pack job status
      description: 'When authenticated with a DeviceApiKey (odm_dev_), access is strictly
        restricted to INGESTION jobs whose device_id matches the key''s bound device
        (returns 404 otherwise). Anonymous public export callers should poll GET /api/v1/exports/{jobId}
        using the returned status_token.

'
      operationId: getJobStatus
      security:
      - SessionCookie: []
      - UserApiKey: []
      - DeviceApiKey: []
      parameters:
      - "$ref": "#/components/parameters/JobId"
      responses:
        '200':
          description: Current job status and progress.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JobStatusResponse"
        '404':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/tracks":
    get:
      tags:
      - Tracks
      summary: List, search, and filter survey tracks owned by the authenticated user
      operationId: listUserTracks
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - name: q
        in: query
        description: Case-insensitive fuzzy title search.
        schema:
          type: string
          maxLength: 100
      - name: is_public
        in: query
        schema:
          type: boolean
      - name: device_id
        in: query
        description: Filter tracks recorded by a specific boat or device.
        schema:
          type: string
          format: uuid
      - name: modality
        in: query
        schema:
          type: string
          enum:
          - BATHYMETRIC_SONAR
          - DIVE_PROFILE
      - name: from
        in: query
        description: Filter tracks with started_at >= from (RFC 3339).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Filter tracks with started_at <= to (RFC 3339).
        schema:
          type: string
          format: date-time
      - name: bbox
        in: query
        description: Filter tracks intersecting current map view (minLon,minLat,maxLon,maxLat).
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - oldest
          - title
          - deepest
          default: newest
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of survey tracks.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SurveyTrackSummary"
                  next_cursor:
                    type:
                    - string
                    - 'null'
  "/api/v1/tracks/{trackId}":
    get:
      tags:
      - Tracks
      summary: Get survey track metadata, vertical datum, and QC statistics
      description: 'For non-owner or anonymous callers, returns only published BATHYMETRIC_SONAR
        tracks using post-redaction public_bbox, public_sounding_count, per-track
        pseudonym device_id, and 15-minute quantized timestamps whenever trim_start_m > 0
        or trim_end_m > 0. Owner-only raw QC counts (good/suspect/bad_sounding_count),
        calibration_revision_id, calibration_stale, and manual offset/default fields
        are omitted to prevent privacy side-channel inference (DIVE_PROFILE and unpublished
        tracks return 404).

'
      operationId: getTrack
      security:
      - {}
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '200':
          description: Survey track details.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SurveyTrackSummary"
        '404':
          "$ref": "#/components/responses/ProblemDetails"
    patch:
      tags:
      - Tracks
      summary: Update track metadata, water body type, tide station override, or manual
        offset
      description: 'Persists metadata updates immediately. If water_body_type, tide_station_id_override,
        manual_water_level_offset_m, or default temp/salinity changed, marks calibration_stale=true
        so the owner can trigger POST /api/v1/tracks/{trackId}/recalibrate.

'
      operationId: updateTrack
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateTrackRequest"
      responses:
        '200':
          description: Updated survey track metadata.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SurveyTrackSummary"
    delete:
      tags:
      - Tracks
      summary: Execute atomic hard-deletion cascade for a survey track
      operationId: deleteTrack
      security:
      - SessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '200':
          description: Track hard-deleted across relational store, object archives,
            and tile caches; returns deletion summary (SHA-256 hash-chained audit
            receipt added in Phase 1.5).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeletionSummary"
        '404':
          "$ref": "#/components/responses/ProblemDetails"
        '409':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/tracks/{trackId}/nearby-tide-stations":
    get:
      tags:
      - Tracks
      summary: Return top 3 nearby NOAA CO-OPS stations for peninsula/estuary tide
        override
      operationId: getNearbyTideStations
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '200':
          description: Nearest active NOAA CO-OPS stations ranked by distance.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/TideStationOption"
  "/api/v1/tracks/{trackId}/privacy-settings":
    get:
      tags:
      - Tracks
      summary: Get the owner's saved entry/exit trim settings for a track
      operationId: getTrackPrivacySettings
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '200':
          description: Saved privacy settings (or defaults if never published).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TrackPrivacySettingsResponse"
        '404':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/tracks/{trackId}/profile":
    get:
      tags:
      - Tracks
      summary: Fetch decimated distance-vs-depth profile series for depth chart inspection
      description: 'For non-owner or anonymous callers, reads strictly from the post-redaction,
        post-trim public sounding archive (never raw or unredacted private soundings)
        and returns 404 for unpublished or DIVE_PROFILE tracks.

'
      operationId: getTrackProfile
      security:
      - {}
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '200':
          description: Decimated track depth profile points (<= 2,000 samples).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TrackProfileResponse"
  "/api/v1/tracks/{trackId}/recalibrate":
    post:
      tags:
      - Tracks
      summary: Explicitly re-run calibration over immutable raw soundings using the
        updated rig revision
      operationId: recalibrateTrack
      security:
      - SessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '202':
          description: Recalibration job queued.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JobStatusResponse"
  "/api/v1/tracks/{trackId}/publish":
    post:
      tags:
      - Tracks
      summary: Apply entry/exit trim sliders and redaction polygons, then publish
        track publicly
      operationId: publishTrack
      security:
      - SessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PublishTrackRequest"
      responses:
        '202':
          description: Privacy redaction and public archive generation accepted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublishTrackResponse"
  "/api/v1/tracks/{trackId}/unpublish":
    post:
      tags:
      - Tracks
      summary: Pull a published track back to private without deleting it from the
        owner vault
      description: 'Sets is_public=false, clears public_geom and public_bbox, deletes
        public GeoParquet partitions, and triggers an immediate priority regional
        PMTiles shard rebuild plus CDN purge while preserving the owner private track.

'
      operationId: unpublishTrack
      security:
      - SessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/TrackId"
      responses:
        '200':
          description: Track unpublished and removed from live public maps and APIs.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnpublishTrackResponse"
        '404':
          "$ref": "#/components/responses/ProblemDetails"
  "/api/v1/search":
    get:
      tags:
      - Catalog
      summary: Unified map search across OpenDepthMap sites, public tracks, tide stations,
        and OSM places
      description: 'Combines fast full-text and spatial search over published waypoints,
        published bathymetric tracks, and NOAA tide stations with server-cached OpenStreetMap
        place geocoding for harbors, bays, coves, and lakes. Direct lat/lon coordinate
        parsing is performed client-side without hitting this endpoint.

'
      operationId: searchMap
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 120
      - name: bbox
        in: query
        description: Optional viewport bias (minLon,minLat,maxLon,maxLat).
        schema:
          type: string
      - name: types
        in: query
        description: Optional comma-separated filter of result types (waypoint,track,tide_station,place).
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      responses:
        '200':
          description: Grouped map search results.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResponse"
        '429':
          "$ref": "#/components/responses/ProblemDetails"
