      type: object
      required:
      - id
      - device_id
      - title
      - started_at
      - ended_at
      - sounding_count
      - vertical_datum
      - tide_source
      - iho_s44_order
      - is_public
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: True vessel/device UUID for the owner; per-track salted pseudonym
            UUID for non-owner/public callers.
        title:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        sounding_count:
          type: integer
          description: Private total count for owner; post-redaction public_sounding_count
            for non-owner callers.
        good_sounding_count:
          type: integer
          description: Owner-only QC count; omitted for non-owner/public callers to
            prevent inferring redacted ping counts.
        suspect_sounding_count:
          type: integer
          description: Owner-only QC count; omitted for non-owner/public callers.
        bad_sounding_count:
          type: integer
          description: Owner-only QC count; omitted for non-owner/public callers.
        min_depth_m:
          type:
          - number
          - 'null'
        max_depth_m:
          type:
          - number
          - 'null'
        vertical_datum:
          "$ref": "#/components/schemas/VerticalDatum"
        tide_source:
          type: string
          enum:
          - PENDING
          - NOAA_COOPS_OBSERVED
          - NOAA_COOPS_PREDICTED
          - FRESHWATER_ZERO
          - MANUAL_OFFSET
          - UNAVAILABLE
        tide_station_id:
          type:
          - string
          - 'null'
        iho_s44_order:
          "$ref": "#/components/schemas/IhoS44Order"
        is_public:
          type: boolean
        track_modality:
          type: string
          enum:
          - BATHYMETRIC_SONAR
          - DIVE_PROFILE
          description: Always BATHYMETRIC_SONAR on Day 1; DIVE_PROFILE is schema-reserved
            for Phase 1.5 dive-computer logs and is always excluded from seafloor
            bathymetry, contours, and IHO B-12 CSB.
        calibration_tier:
          type: string
          enum:
          - UNREDUCED
          - TIDE_REDUCED
          - SV_TIDE_CALIBRATED
          - MOTION_COMPENSATED
        calibration_revision_id:
          type: string
          format: uuid
          description: Owner-only field; omitted for non-owner/public callers.
        calibration_stale:
          type: boolean
          description: Owner-only flag; true when the device calibration revision
            for this track's time window was edited after last calibration.
        water_body_type:
          "$ref": "#/components/schemas/WaterBodyType"
        tide_station_id_override:
          type:
          - string
          - 'null'
          description: Owner-only pinned NOAA CO-OPS station ID override.
        manual_water_level_offset_m:
          type:
          - number
          - 'null'
          description: Owner-only manual water-level offset; omitted for non-owner/public
            callers.
        water_temp_default_c:
          type:
          - number
          - 'null'
          description: Owner-only fallback water temperature; omitted for non-owner/public
            callers.
        salinity_default_psu:
          type:
          - number
          - 'null'
          description: Owner-only fallback salinity; omitted for non-owner/public callers.
        bbox:
          type:
          - array
          - 'null'
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: Private bbox for owner; post-redaction public_bbox (or null
            if fully trimmed/redacted) for non-owner callers.
