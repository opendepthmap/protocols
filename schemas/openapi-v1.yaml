  "/tiles/manifest.json":
    get:
      tags:
      - Tiles
      summary: Public regional PMTiles shard manifest for viewport vector tile mounting
        (served on tiles.opendepthmap.org)
      operationId: getPublicTilesManifest
      responses:
        '200':
          description: Active regional PMTiles shards, OSM attribution, and mandatory
            disclaimer.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TileManifestResponse"
  "/tiles/private/{z}/{x}/{y}.mvt":
    get:
      tags:
      - Tiles
      summary: Serve dynamic MVT vector tiles for authenticated private vault tracks
      operationId: getPrivateMvtTile
      security:
      - SessionCookie: []
      - UserApiKey: []
      parameters:
      - name: z
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 20
      - name: x
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      - name: y
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Mapbox Vector Tile binary payload.
          content:
            application/vnd.mapbox-vector-tile:
              schema:
                type: string
                format: binary
        '204':
          description: Empty tile.
        '401':
          "$ref": "#/components/responses/ProblemDetails"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-odm-session
      description: 'First-party SameSite=Lax HttpOnly Secure browser session cookie
        issued on https://opendepthmap.org. State-changing cookie requests MUST include
        the X-Requested-With: OpenDepthMap CSRF header.'
    UserApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Personal User API Key (odm_usr_ prefix) with configurable scopes.
    DeviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Vessel/Device API Key (odm_dev_ prefix) restricted strictly to
        write:tracks scope.
  parameters:
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemDetails:
      description: RFC 9457 Problem Details error response.
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            - status
            properties:
              type:
                type: string
                format: uri
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              error_code:
                type: string
              trace_id:
                type: string
  schemas:
    VerticalDatum:
      type: string
      enum:
      - UNREDUCED
      - MLLW
      - IGLD
      - LOCAL_LAKE
      - MANUAL_DATUM
    IhoS44Order:
      type: string
      enum:
      - SPECIAL_ORDER
      - ORDER_1A
      - ORDER_1B
      - ORDER_2
      - UNASSESSED_CSB
    SourceFormat:
      type: string
      description: Day-1 GA open sonar and track formats.
      enum:
      - GPX
      - GEOJSON
      - CSV
      - NMEA_0183
    WaterBodyType:
      type: string
      enum:
      - COASTAL_TIDAL
      - GREAT_LAKES
      - INLAND_FRESHWATER
    DeviceCategory:
      type: string
      enum:
      - SURFACE_BUOY
      - RECREATIONAL_VESSEL
      - DIVER_COMPUTER
      - USV_AUTONOMOUS
      - THIRD_PARTY_PLOTTER
    UserApiKeySummary:
      type: object
      required:
      - id
      - name
      - key_prefix
      - scopes
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          example: odm_usr_9a3f
        scopes:
          type: array
          items:
            type: string
            enum:
            - read:public
            - read:prefs
            - write:tracks
            - write:waypoints
            - read:private_vault
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateUserApiKeyRequest:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - read:public
            - read:prefs
            - write:tracks
            - write:waypoints
            - read:private_vault
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    CreateUserApiKeyResponse:
      allOf:
      - "$ref": "#/components/schemas/UserApiKeySummary"
      - type: object
        required:
        - plaintext_key
        properties:
          plaintext_key:
            type: string
            description: Returned once at creation time. Store securely.
    DeviceProfile:
      type: object
      required:
      - id
      - name
      - device_category
      - key_prefix
      - depth_reference
      - draft_offset_m
      - antenna_offset_x_m
      - antenna_offset_y_m
      - antenna_offset_z_m
      - assumed_sound_speed_ms
      - is_active
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        device_category:
          "$ref": "#/components/schemas/DeviceCategory"
        key_prefix:
          type: string
          example: odm_dev_4c21
        depth_reference:
          type: string
          enum:
          - BELOW_TRANSDUCER
          - BELOW_WATERLINE
        draft_offset_m:
          type: number
        antenna_offset_x_m:
          type: number
        antenna_offset_y_m:
          type: number
        antenna_offset_z_m:
          type: number
        transducer_freq_khz:
          type:
          - integer
          - 'null'
        beamwidth_deg:
          type:
          - number
          - 'null'
        assumed_sound_speed_ms:
          type: number
        active_calibration_effective_from:
          type: string
          format: date-time
        is_active:
          type: boolean
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateDeviceRequest:
      type: object
      required:
      - name
      - device_category
      properties:
        name:
          type: string
          maxLength: 100
        device_category:
          "$ref": "#/components/schemas/DeviceCategory"
        effective_from:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional start timestamp for initial calibration revision (defaults
            to 1970-01-01T00:00:00Z).
        depth_reference:
          type: string
          enum:
          - BELOW_TRANSDUCER
          - BELOW_WATERLINE
          default: BELOW_TRANSDUCER
        draft_offset_m:
          type: number
          default: 0.0
        antenna_offset_x_m:
          type: number
          default: 0.0
        antenna_offset_y_m:
          type: number
          default: 0.0
        antenna_offset_z_m:
          type: number
          default: 0.0
        transducer_freq_khz:
          type:
          - integer
          - 'null'
          minimum: 10
          maximum: 2000
        beamwidth_deg:
          type:
          - number
          - 'null'
          minimum: 0.5
          maximum: 180.0
        assumed_sound_speed_ms:
          type: number
          default: 1500.0
          minimum: 1400.0
          maximum: 1600.0
    UpdateDeviceRequest:
