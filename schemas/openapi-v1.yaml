openapi: 3.1.0
info:
  title: OpenDepthMap External API
  version: 1.0.0
  summary: Vendor-neutral bathymetric ingestion, privacy vault, OGC API - Features, and open export API.
  description: >
    Public Phase 1 REST and OGC API - Features contract for OpenDepthMap (opendepthmap.org).
    Supplemental bathymetric reference only. Not certified for primary marine navigation;
    always consult official NOAA/IHO nautical charts.
  license:
    name: CC0-1.0
    identifier: CC0-1.0
servers:
  - url: https://opendepthmap.org
    description: Production API (same-origin with web portal)
  - url: http://localhost:5080
    description: Local developer sandbox
security: []
tags:
  - name: Auth
    description: OAuth2 Device Authorization Flow and Personal User API Key management.
  - name: Devices
    description: Mandatory pre-upload vessel and sensor rig registration.
  - name: Ingestion
    description: Two-step direct-to-storage upload contract and async job status.
  - name: Tracks
    description: Survey track inspection, publishing, and atomic hard-deletion cascades.
  - name: Privacy
    description: Spatial redaction zones, site steward takedowns, and deletion audit receipts.
  - name: Waypoints
    description: Subsea waypoints with CMECS and Darwin Core ecological enrichment.
  - name: Routing
    description: Planned water routes, survey transects, and offline PMTiles chart packs.
  - name: Exports
    description: GeoParquet 1.1 and IHO B-12 CSB exports (Day-1 GA), gridded CF-NetCDF/COG (Phase 1.5), and DOI dataset releases.
  - name: OGC
    description: OGC API - Features Part 1 and Part 2 endpoints.
  - name: Tiles
    description: Authenticated private dynamic MVT vector tiles.
  - name: Catalog
    description: Unified map search and cached public marine observation stations.
  - name: System
    description: Public coverage counters, system feature flags, and liveness/readiness probes.
paths:
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Terminate the active browser session
      operationId: logoutAccount
      security:
        - SessionCookie: []
      responses:
        "204":
          description: Session terminated.
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile, roles, and Contributor Terms status
      operationId: getCurrentUser
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:prefs"]
        - UserApiKey: []
      responses:
        "200":
          description: Current authenticated user context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          $ref: "#/components/responses/ProblemDetails"
    patch:
      tags: [Auth]
      summary: Update contributor display_name or bio
      operationId: updateCurrentUser
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 3
                  maxLength: 80
                bio:
                  type: [string, "null"]
                  maxLength: 1000
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
  /api/v1/auth/accept-terms:
    post:
      tags: [Auth]
      summary: Record explicit acceptance of CC0-1.0 Contributor Terms prior to public publishing
      operationId: acceptContributorTerms
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms_version, accepted]
              properties:
                terms_version:
                  type: string
                  example: "1.0.0"
                accepted:
                  type: boolean
                  const: true
      responses:
        "200":
          description: Contributor Terms acceptance timestamp recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
  /api/v1/auth/passkeys:
    get:
      tags: [Auth]
      summary: List enrolled FIDO2 Passkeys for the authenticated user
      operationId: listPasskeys
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Enrolled passkey metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PasskeySummary"
  /api/v1/auth/passkeys/{passkeyId}:
    patch:
      tags: [Auth]
      summary: Rename an enrolled FIDO2 Passkey
      operationId: renamePasskey
      security:
        - SessionCookie: []
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friendly_name]
              properties:
                friendly_name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: Passkey renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeySummary"
    delete:
      tags: [Auth]
      summary: Remove an enrolled FIDO2 Passkey
      operationId: deletePasskey
      security:
        - SessionCookie: []
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Passkey removed.
        "409":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/auth/passkeys/register/options:
    post:
      tags: [Auth]
      summary: Generate WebAuthn FIDO2 Passkey registration challenge options
      operationId: beginPasskeyRegistration
      security:
        - SessionCookie: []
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions payload.
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/passkeys/register/verify:
    post:
      tags: [Auth]
      summary: Verify WebAuthn attestation and persist a new FIDO2 Passkey
      operationId: completePasskeyRegistration
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friendly_name, attestation_response]
              properties:
                friendly_name:
                  type: string
                  maxLength: 100
                attestation_response:
                  type: object
      responses:
        "201":
          description: Passkey enrolled.
          content:
            application/json:
              schema:
                type: object
                required: [id, friendly_name, created_at]
                properties:
                  id:
                    type: string
                    format: uuid
                  friendly_name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
  /api/v1/auth/passkeys/login/options:
    post:
      tags: [Auth]
      summary: Generate WebAuthn FIDO2 Passkey sign-in or Admin step-up assertion challenge
      operationId: beginPasskeyLogin
      security:
        - {}
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                step_up:
                  type: boolean
                  default: false
                  description: When true with an active SessionCookie, scopes allowCredentials to the signed-in user with userVerification required.
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions payload.
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/passkeys/login/verify:
    post:
      tags: [Auth]
      summary: Verify WebAuthn FIDO2 Passkey assertion and establish session
      operationId: completePasskeyLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assertion_response]
              properties:
                assertion_response:
                  type: object
      responses:
        "200":
          description: Passkey-verified session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
  /api/v1/auth/external/{provider}/start:
    get:
      tags: [Auth]
      summary: Initiate OAuth2/OIDC redirect for Google or GitHub sign-in or account linking
      operationId: startExternalOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: return_url
          in: query
          description: Relative local path only (starts with /, never //, /\\, or external host; prevents CWE-601 open redirect).
          schema:
            type: string
      responses:
        "302":
          description: Redirects browser to external OAuth provider authorization endpoint.
  /api/v1/auth/external/{provider}/callback:
    get:
      tags: [Auth]
      summary: Complete OAuth2/OIDC authorization code callback for Google or GitHub
      description: Validates state/PKCE correlation cookies, requires verified provider email before account linking, sets __Host-odm-session, and redirects to validated local return_url.
      operationId: completeExternalOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects to validated local return_url with authenticated session cookie.
        "400":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/auth/external/{provider}:
    delete:
      tags: [Auth]
      summary: Unlink an external OAuth provider from the user account
      operationId: unlinkExternalProvider
      security:
        - SessionCookie: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        "204":
          description: External provider unlinked.
        "409":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/auth/account:
    delete:
      tags: [Auth]
      summary: Execute atomic hard-deletion cascade for the entire user account
      description: Requires interactive browser session with recent re-authentication (never callable via OAuth Bearer or API keys).
      operationId: deleteAccount
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Account, devices, tracks, waypoints, and storage purged; returns PII-free deletion audit receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionAuditReceipt"
  /api/v1/auth/device/code:
    post:
      tags: [Auth]
      summary: Initiate OAuth2 Device Authorization Grant (RFC 8628)
      operationId: initiateDeviceAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                  example: opendepthmap-buoy
                scope:
                  type: string
                  default: "write:tracks"
      responses:
        "200":
          description: Device authorization challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/auth/device/token:
    post:
      tags: [Auth]
      summary: Poll OAuth2 Device Authorization Grant for completion
      operationId: pollDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, device_code]
              properties:
                grant_type:
                  type: string
                  const: "urn:ietf:params:oauth:grant-type:device_code"
                device_code:
                  type: string
                client_id:
                  type: string
      responses:
        "200":
          description: Pairing approved; returns scoped device access token and device API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/auth/device/verify:
    get:
      tags: [Auth]
      summary: Look up pending RFC 8628 device pairing challenge details by user_code
      operationId: lookupDeviceCode
      security:
        - SessionCookie: []
      parameters:
        - name: user_code
          in: query
          required: true
          schema:
            type: string
            example: ODM-7K9P
      responses:
        "200":
          description: Pending device pairing details shown for explicit user confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [user_code, client_id, scope, expires_at, status]
                properties:
                  user_code:
                    type: string
                  client_id:
                    type: string
                  scope:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [PENDING, EXPIRED]
        "404":
          $ref: "#/components/responses/ProblemDetails"
    post:
      tags: [Auth]
      summary: Approve or deny an RFC 8628 headless device pairing challenge from /device
      operationId: verifyDeviceCode
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code, decision]
              properties:
                user_code:
                  type: string
                  example: ODM-7K9P
                decision:
                  type: string
                  enum: [APPROVE, DENY]
                device_id:
                  type: [string, "null"]
                  format: uuid
                  description: Optional existing device to bind; if null, registers a new device profile.
                device_name:
                  type: [string, "null"]
                  maxLength: 100
                  description: Friendly name for the newly registered device when device_id is null.
                device_category:
                  type: [string, "null"]
                  enum: [BOAT_CHARTPLOTTER, KAYAK_SOUNDER, SURVEY_BUOY, DIVE_COMPUTER, DIY_LOGGER, null]
      responses:
        "200":
          description: Device authorization decision recorded.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [APPROVED, DENIED]
  /api/v1/api-keys:
    get:
      tags: [Auth]
      summary: List Personal User API Keys
      operationId: listUserApiKeys
      security:
        - SessionCookie: []
      responses:
        "200":
          description: List of Personal User API Key metadata (never returns raw key secrets).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserApiKeySummary"
    post:
      tags: [Auth]
      summary: Create a scoped Personal User API Key (odm_usr_ prefix)
      operationId: createUserApiKey
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserApiKeyRequest"
      responses:
        "201":
          description: Created Personal User API Key (raw secret shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserApiKeyResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/api-keys/{keyId}:
    delete:
      tags: [Auth]
      summary: Revoke a Personal User API Key immediately
      operationId: revokeUserApiKey
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: API key revoked.
        "404":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List registered vessels and field devices
      operationId: listDevices
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:prefs"]
        - UserApiKey: []
      responses:
        "200":
          description: Registered devices owned by the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceProfile"
    post:
      tags: [Devices]
      summary: Register a vessel or hardware device with sensor rig offsets
      operationId: registerDevice
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
        - UserApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Device registered; returns device profile and one-time Device API Key (odm_dev_).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeviceResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/devices/{deviceId}:
    patch:
      tags: [Devices]
      summary: Update device identity metadata (name, category)
      operationId: updateDevice
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
        - UserApiKey: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: Updated device profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProfile"
    delete:
      tags: [Devices]
      summary: Soft-deactivate a device and immediately revoke its Device API Key
      description: >
        Revokes the device credential and prevents future uploads while preserving historical
        survey track provenance and calibration snapshots.
      operationId: deactivateDevice
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
        - UserApiKey: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device deactivated and key revoked.
  /api/v1/devices/{deviceId}/rotate-key:
    post:
      tags: [Devices]
      summary: Rotate a Device API Key (odm_dev_) without altering calibration history
      operationId: rotateDeviceApiKey
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Previous device key immediately revoked; returns new one-time plaintext Device API Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDeviceResponse"
  /api/v1/devices/{deviceId}/calibrations:
    get:
      tags: [Devices]
      summary: List effective-dated sensor rig calibration revisions for a device
      operationId: listDeviceCalibrations
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:prefs"]
        - UserApiKey: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Chronological non-overlapping calibration revisions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceCalibrationRevision"
    post:
      tags: [Devices]
      summary: Add a new effective-dated sensor rig calibration revision
      description: >
        Records a time-bounded sensor rig offset revision without mutating existing tracks.
        Automatically closes an open-ended prior revision when effective_from is later;
        returns 409 Conflict if the range overlaps an existing closed revision.
      operationId: createDeviceCalibration
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
        - UserApiKey: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceCalibrationRequest"
      responses:
        "201":
          description: Calibration revision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCalibrationRevision"
        "409":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/devices/{deviceId}/calibrations/{revisionId}:
    patch:
      tags: [Devices]
      summary: Correct an existing effective-dated sensor rig calibration revision
      description: >
        Updates a historical or active calibration revision without silently mutating existing tracks.
        Tracks captured within the revision window are marked calibration_stale=true so owners
        can explicitly trigger POST /api/v1/tracks/{trackId}/recalibrate.
      operationId: updateDeviceCalibration
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
        - UserApiKey: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceCalibrationRequest"
      responses:
        "200":
          description: Calibration revision updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCalibrationRevision"
        "409":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/tracks/upload-url:
    post:
      tags: [Ingestion]
      summary: Request a 15-minute single-use signed direct PUT URL for raw sonar/track upload
      description: >
        When authenticated with a DeviceApiKey (odm_dev_), request.device_id MUST match the
        device bound to that key; mismatches return 403 Forbidden.
      operationId: requestTrackUploadUrl
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["write:tracks"]
        - UserApiKey: []
        - DeviceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "201":
          description: Ingestion job created in PENDING_UPLOAD state with scoped single-use signed PUT URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails"
        "403":
          $ref: "#/components/responses/ProblemDetails"
        "413":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/jobs:
    get:
      tags: [Ingestion]
      summary: List recent asynchronous jobs (ingestion, recalibration, publish, export, offline pack, media) owned by the user
      operationId: listUserJobs
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:public"]
        - OAuth2Bearer: ["read:prefs"]
        - OAuth2Bearer: ["write:tracks"]
        - OAuth2Bearer: ["read:private_vault"]
        - UserApiKey: []
      parameters:
        - name: job_type
          in: query
          schema:
            type: string
            enum: [INGESTION, RECALIBRATE, EXPORT, OFFLINE_PACK, PUBLISH, MEDIA_PROCESSING]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of user jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobStatusResponse"
                  next_cursor:
                    type: [string, "null"]
  /api/v1/jobs/{jobId}:
    get:
      tags: [Ingestion]
      summary: Get asynchronous ingestion, recalibration, publish, export, offline pack, or media job status
      description: >
        When authenticated with a DeviceApiKey (odm_dev_), access is strictly restricted to
        INGESTION jobs whose device_id matches the key's bound device (returns 404 otherwise).
        Anonymous public export callers should poll GET /api/v1/exports/{jobId} using the returned status_token.
      operationId: getJobStatus
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:public"]
        - OAuth2Bearer: ["read:prefs"]
        - OAuth2Bearer: ["write:tracks"]
        - OAuth2Bearer: ["read:private_vault"]
        - UserApiKey: []
        - DeviceApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job status and progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          $ref: "#/components/responses/ProblemDetails"
  /api/v1/tracks:
    get:
      tags: [Tracks]
      summary: List, search, and filter survey tracks owned by the authenticated user
      operationId: listUserTracks
      security:
        - SessionCookie: []
        - OAuth2Bearer: ["read:private_vault"]
        - UserApiKey: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive fuzzy title search.
          schema:
            type: string
            maxLength: 100
        - name: is_public
          in: query
          schema:
            type: boolean
        - name: device_id
          in: query
          description: Filter tracks recorded by a specific boat or device.
          schema:
            type: string
            format: uuid
        - name: modality
          in: query
          schema:
            type: string
            enum: [BATHYMETRIC_SONAR, DIVE_PROFILE]
        - name: from
          in: query
          description: Filter tracks with started_at >= from (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter tracks with started_at <= to (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: bbox
          in: query
          description: Filter tracks intersecting current map view (minLon,minLat,maxLon,maxLat).
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, title, deepest]
            default: newest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of survey tracks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SurveyTrackSummary"
                  next_cursor:
                    type: [string, "null"]
